[package]
name = "shmod"
version = "0.3.0"
edition = "2021"
description = "Context-selective bash configuration loader (Rust rewrite)"
license = "MIT"

[[bin]]
name = "shmod"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
